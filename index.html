<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skládání rozvrhu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐗%3C/text%3E%3C/svg%3E">
<script>
/* Motiv co nejdřív (před prvním paintem), ať tmavý režim neblikne světlým pozadím.
   Uloženou volbu čte synchronně z localStorage; bez ní platí systémová preference. */
try{
  var t=localStorage.getItem("theme");
  document.documentElement.setAttribute("data-theme",
    t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
}catch(e){document.documentElement.setAttribute("data-theme","light")}
</script>
<style>
  /* ---------- TÉMA / PROMĚNNÉ ---------- */
  :root{
    --bg:#f4f3ef; --surface:#ffffff; --surface-2:#faf9f6; --line:#e2ded6;
    --ink:#26221c; --ink-soft:#6c655a; --accent:#8a1c34; --accent-soft:#b34a5f;
    --ok:#1e7d4f; --ok-bg:#e7f4ec; --bad:#c12d3a; --bad-bg:#fbe9e9;
    --it:#3b5bdb; --ele:#c2640a; --str:#0f766e; --ep:#6d5acd; --gen:#8a8577;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
    --radius:10px;
  }
  html[data-theme="dark"]{
    --bg:#15161a; --surface:#1d1f25; --surface-2:#23262d; --line:#34373f;
    --ink:#e8e6e1; --ink-soft:#9b9890; --accent:#e0708a; --accent-soft:#c75a73;
    --ok:#4ec98a; --ok-bg:#16352a; --bad:#f08a93; --bad-bg:#3a1f22;
    --it:#7e95ff; --ele:#eaa14f; --str:#4ec3b6; --ep:#a596f0; --gen:#9b9890;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);border-radius:8px;padding:7px 12px;transition:.12s}
  button:hover:not(:disabled){border-color:var(--accent-soft)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.06)}
  button.ghost{background:transparent}
  select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
  .muted{color:var(--ink-soft)}
  a{color:var(--accent)}

  /* hlavička: titul | level (vínově, jako odkaz) + počítadlo · popis levelu pod tím · vpravo akce.
     Na úzkém displeji dvě řádky (titul + ikony, level přes šířku), Editor a Uložit v „Více“. */
  header{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"title lvl . ctrls" "desc desc desc ctrls";
    align-items:center;column-gap:12px;row-gap:2px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);position:relative}
  header .title{grid-area:title;font-size:18px;font-weight:650;line-height:1.15}
  header .lvl{grid-area:lvl;display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px}
  header #lvlDesc{grid-area:desc;font-size:12px;color:var(--ink-soft);line-height:1.3}
  header .ctrls{grid-area:ctrls;display:flex;gap:8px;align-items:center;justify-self:end}
  .lvlsel{font:inherit;font-size:14px;font-weight:650;color:var(--accent);border:0;background:transparent;padding:2px 0;cursor:pointer;max-width:260px}
  .badge{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
  .btngroup{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .btngroup>button{border:0;border-radius:0;border-left:1px solid var(--line);background:transparent;display:inline-flex;align-items:center}
  .btngroup>button:first-child{border-left:0}
  .btngroup>button:hover:not(:disabled){background:var(--surface-2)}
  .more{display:contents} /* desktop: tlačítka přímo v hlavičce */
  #moreBtn{display:none}
  #aboutBtn,#themeBtn{padding:7px 10px}

  /* rezervu pod obsahem počítá JS z výšky fixní lišty: --dock-h.
     Ovládání dole musí být vždy na obrazovce, nikdy se k němu nescrolluje. */
  .wrap{display:flex;gap:14px;align-items:flex-start;padding:14px 18px calc(var(--dock-h,80px) + 20px);max-width:1500px;margin:0 auto}
  html{overflow-x:hidden} /* stránka nesmí scrollovat do stran — obsah se skládá do šířky (rozvrh 1fr, paleta zalamuje).
                             Jen na html, ne na body: overflow na body z něj udělá scroll kontejner a position:sticky sloupců přestane držet */
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .col-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .col-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .col-body{padding:12px 14px}
  .col-foot{padding:10px 14px;border-top:1px solid var(--line)}
  #schedule{overflow-x:auto} /* jen pojistka pro vlastní levely s mnoha hodinami; kampaň se vejde */

  #colPalette{flex:0 0 250px} /* 2h kartička (222 px) + vnitřní odsazení */
  #colSchedule{flex:1 1 auto;min-width:0}
  #colGoals{flex:0 0 280px}
  /* třísloupcové rozložení: zásobník a požadavky jsou přilepené k hornímu okraji a scrollují UVNITŘ sebe,
     takže cesta ke kartičkám dole neodveze rozvrh ani úkoly z obrazu (Jakub, 21. 8. 2026). Výška = okno
     minus dok; stránkou se scrolluje jen kvůli rozvrhu (dva týdny). */
  @media(min-width:1101px){
    #colPalette,#colGoals{position:sticky;top:14px;max-height:calc(100vh - var(--dock-h,80px) - 28px);display:flex;flex-direction:column}
    #colPalette .col-head,#colPalette .col-foot,#colGoals .col-head{flex-shrink:0}
    #colPalette .col-body,#colGoals .col-body{overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
  }
  @media(max-width:1100px){.wrap{flex-direction:column}
    #colPalette,#colSchedule,#colGoals{flex:1 1 auto;width:100%;min-width:0}}
  /* ÚZKÝ DISPLEJ (stejná hranice jako překlopení rozvrhu): hlavička na dva řádky, paleta jen aktivní
     třídy zalomená do řádků, rozvrh bez ×, požadavky jako sbalený proužek nahoře nad zásobníkem, lišta na jeden řádek ikon */
  @media(max-width:819px){
    header{grid-template-columns:1fr auto;grid-template-areas:"title ctrls" "lvl lvl";column-gap:8px;row-gap:8px;padding:10px 14px}
    header .title{font-size:16px}
    header .lvl{border-left:0;padding-left:0}
    header #lvlDesc{display:none}
    .lvlsel{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:none}
    .more{display:none;position:absolute;right:14px;top:calc(100% - 6px);flex-direction:column;gap:4px;padding:6px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40}
    .more.open{display:flex}
    #moreBtn{display:inline-flex}
    .wrap{padding-left:14px;padding-right:14px}
    #colGoals{order:-1} /* požadavky nahoru: nad zásobník i rozvrh (Jakub, 25. 8. 2026) */
    #colGoals .col-head{cursor:pointer;padding:8px 12px}
    #colGoals .col-head h2{display:none}
    #colGoals .col-body{display:none} /* v toku scrolluje stránkou — vlastní okno bylo kvůli fixnímu proužku */
    #colGoals.open .col-body{display:block}
    #colGoals.open .gcaret{transform:rotate(180deg)}
    .toolbar{padding:8px 14px 10px;gap:8px}
    .toolbar button{min-width:44px;height:40px;justify-content:center}
    .toolbar .btngroup>button{height:38px}
    .toolbar .lbl{display:none}
    #randomBtn{flex:1}
    .toolbar .spacer{display:none}
    .toolbar .status{width:100%;font-size:12px}
  }
  #colGoals .gsum{display:none;align-items:center;gap:8px;flex:1;font-size:13px}
  #colGoals .gcaret{display:none;font-size:11px;color:var(--ink-soft);transition:transform .15s}
  .toolbar .lbl-s{display:none}

  /* ---------- KARTIČKY ---------- */
  .palette{display:flex;flex-direction:column;gap:10px}
  .pg-head{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
  .pg-head b{font-weight:650}
  .pg-head .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .pg-head .ln{flex:1;height:1px;background:var(--line)}
  .pg-cards{display:flex;flex-wrap:wrap;gap:8px}
  .pgroup.dim .pg-head{color:var(--ink-soft)} .pgroup.dim .card{opacity:.55} /* cizí třída: vidět, ale v pozadí */
  #colPalette.over{outline:2px dashed var(--ok);outline-offset:-2px} /* tažení zpět do zásobníku = odebrání */
  .palette-note{font-size:12px;color:var(--ink-soft)}
  .card{position:relative;border:1px solid var(--line);border-left:4px solid var(--f);
    border-radius:8px;padding:6px 8px;background:color-mix(in srgb,var(--f) 18%,var(--surface));
    cursor:grab;user-select:none}
  .card:active{cursor:grabbing}
  .card .subj{font-weight:650;font-size:13px}
  .card .meta{font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .card .chip{display:inline-block;font-size:10px;padding:1px 5px;border-radius:99px;
    background:color-mix(in srgb,var(--f) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--f) 35%,var(--surface))}
  .card.sel{outline:2px solid var(--accent);outline-offset:1px}
  /* nařízená pauza (oběd) — šrafovaná, vizuálně mimo obory */
  .card.brk,.pcard.brk{--f:var(--ink-soft);color:var(--ink-soft);
    background-image:repeating-linear-gradient(135deg,transparent,transparent 4px,
      color-mix(in srgb,var(--ink-soft) 22%,transparent) 4px,color-mix(in srgb,var(--ink-soft) 22%,transparent) 8px);
    background-color:var(--surface-2);border-style:dashed}
  .card.brk .subj,.pcard.brk .subj{font-weight:600;font-style:italic}
  /* délka bloku = ŠÍŘKA kartičky i v paletě (jako v rozvrhu na desktopu, kde jsou hodiny sloupce):
     jednohodinovka je užší, dvouhodinovka delší, výška je pořád stejná; hranice hodiny je svislá
     čárkovaná linka. Není to proporční (1h by se s popiskem do půlky nevešla), jen zřetelně „kratší“.
     Štítek „2h“ v paletě nestačil a dvojnásobná VÝŠKA byl nesmysl (Jakub, 21. 8. 2026). */
  .card{width:min(100%,calc(108px + var(--dur,1) * 57px))} /* 1h 165 px · 2h 222 px · 3h 279 px */
  .card .tick{position:absolute;pointer-events:none;top:6px;bottom:6px;width:0;
    border-left:1px dashed color-mix(in srgb,var(--f) 60%,transparent)}
  .palette-empty{font-size:13px;color:var(--ink-soft);padding:8px 2px}

  /* ---------- ROZVRH ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  /* dvě úrovně, dvě tvarosloví: hlavní přepínač dimenze (Třídy / Učitelé / Učebny) je segmentový
     ovladač — jeden rámeček, verzálky, aktivní segment „vystouplý“; podružné záložky entit jsou
     samostatné pilulky s plnou barvou. Dřív šlo o dvě řady podobných obdélníků (Jakub, 21. 8. 2026). */
  .seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
  .tab.view{border:0;background:transparent;border-radius:7px;padding:4px 11px;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .tab.view:hover:not(.active){color:var(--ink)}
  .tab.view.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
  .tab:not(.view){padding:4px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px}
  .tab:not(.view).active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabsel{font:inherit;font-size:13px;padding:4px 10px;cursor:pointer}
  .tabsep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
  .week{margin-top:14px}
  .week-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px}
  .grid{display:grid;gap:4px}
  /* hodiny a dny jako tlumené štítky; prázdná buňka bez čárkování (tišší), čárkovaný rámeček dostane až drop zóna */
  .gh,.gp{font-size:12px;font-weight:650;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border-radius:6px}
  .gh{color:var(--ink-soft)} .gp{color:var(--ink)}
  .cell{border:1px solid color-mix(in srgb,var(--line) 60%,var(--surface));border-radius:7px;min-height:46px;background:var(--surface-2)}
  /* drop zóna = „sem SMÍŠ“ → zelená (barva splněného požadavku); vínová/červená je ve hře konflikt
     a zóny v ní vypadaly jako zákaz (Jakub, 21. 8. 2026) */
  .cell.drop{border:1px dashed var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface-2))} /* výraznější i na slunci */
  .cell.over{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 26%,var(--surface-2))}
  /* položená kartička musí být na první pohled „věc“ položená NA mřížce, ne další prázdná buňka:
     sytější výplň oboru, rámeček v barvě oboru a lehký stín (16% tint splýval s volným místem, 21. 8. 2026) */
  .pcard{border:1px solid color-mix(in srgb,var(--f) 55%,var(--line));border-left:4px solid var(--f);border-radius:7px;
    background:color-mix(in srgb,var(--f) 30%,var(--surface));padding:4px 6px;overflow:hidden;
    display:flex;flex-direction:column;cursor:grab;position:relative;overflow-wrap:anywhere;
    box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .pcard .sub{color:color-mix(in srgb,var(--ink) 78%,var(--ink-soft))} /* na sytější výplni drž kontrast */
  .pcard .subj{font-weight:650;font-size:12px;line-height:1.15;padding-right:16px;hyphens:auto}
  .pcard .sub{font-size:10px;color:var(--ink-soft)}
  /* desktop („na šířku“): údaje ve dvou sloupcích — předmět | učebna, učitel/třída | budova;
     tři řádky pod sebou se do buňky (a hlavně do pruhu) nevešly */
  .card .info,.pcard .info{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;align-items:baseline}
  .info .subj{padding-right:0}
  .info .r{text-align:right;white-space:nowrap}
  .pcard .info .r{padding-right:18px} /* místo pro × / 🔒 nahoře a štítek „2h“ dole */
  /* paleta drží stejnou logiku (předmět | učebna, učitel | budova); navíc nese čip třídy u učitele */
  .card .sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .card .sub .chip{margin-right:4px}
  .pcard.conflict{border-color:var(--bad);border-left-color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
  .lanegrp{display:flex;flex-direction:column;gap:3px;min-width:0} /* transponovaný překryv: kartičky pod sebou v jednom bloku */
  .lanegrp .pcard{min-height:46px}
  .pcard .x{position:absolute;top:2px;right:3px;width:16px;height:16px;line-height:14px;text-align:center;
    border-radius:5px;font-size:12px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line)}
  .pcard .x:hover{color:var(--bad);border-color:var(--bad)}
  /* vícehodinové bloky: čárky na hranicích hodin + štítek délky — ať je dvojhodinovka poznat na první pohled */
  /* hranice hodin jen jako zářezy na okrajích — čárkovaná linka přes celý blok dělala z dvouhodinovky dvě buňky */
  .pcard .tick{position:absolute;pointer-events:none;opacity:.7}
  .pcard .tick.h{top:0;bottom:0;width:2px;margin-left:-1px;
    background:linear-gradient(var(--f) 0 7px,transparent 7px calc(100% - 7px),var(--f) calc(100% - 7px))}
  .pcard .tick.v{left:0;right:0;height:2px;margin-top:-1px;
    background:linear-gradient(90deg,var(--f) 0 7px,transparent 7px calc(100% - 7px),var(--f) calc(100% - 7px))}
  .pcard .durb{position:absolute;bottom:2px;right:3px;font-size:9px;line-height:1.3;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 3px}

  /* ---------- POINTER DRAG ---------- */
  .card,.pcard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .card.drag-src{opacity:.35}
  .drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.92;
    box-shadow:0 6px 20px rgba(0,0,0,.25);will-change:transform}
  html.dragging{user-select:none}
  html.dragging *{cursor:grabbing!important}

  /* ---------- ZAMČENÉ KARTIČKY (iron-man / given) ---------- */
  .pcard.locked{cursor:default;border-style:solid}
  .pcard .lockb{position:absolute;top:2px;right:3px;font-size:9px;line-height:1;opacity:.75}

  /* ---------- POŽADAVKY ---------- */
  .score{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .score b{font-size:26px}
  .score b .of{font-size:16px;font-weight:500;color:var(--ink-soft)}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 12px}
  .bar>div{height:100%;background:var(--ok);transition:width .25s}
  .segbar{display:flex;gap:4px;margin:4px 0 12px} /* jeden dílek = jeden požadavek */
  .segbar>i{flex:1;height:8px;border-radius:99px;background:var(--line)} .segbar>i.met{background:var(--ok)}
  .gsum .segbar{margin:0;width:90px} .gsum .segbar>i{height:6px}
  .conf-line.bad{display:flex;gap:8px;align-items:flex-start} .conf-line .why{font-size:12px;margin-top:2px;font-weight:400}
  .goal{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
  .goal:first-child{border-top:0}
  .dot{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-soft);margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .goal.met .dot{background:var(--ok);border-color:var(--ok)}
  .goal .txt{font-size:13px}
  .goal.met .txt{color:var(--ink-soft)}
  .conf-line{margin:10px 0 4px;padding:8px 10px;border-radius:8px;font-size:13px}
  .conf-line.bad{background:var(--bad-bg);color:var(--bad)}
  .conf-line.ok{background:var(--ok-bg);color:var(--ok)}
  .win{margin-top:12px;padding:12px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-weight:650;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
  .win .next{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:650} /* jediné zvýrazněné tlačítko ve hře: postup dál */

  /* ---------- LIŠTA / STAV ---------- */
  .toolbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;padding:9px 18px;z-index:30;flex-wrap:wrap}
  .status{font-size:13px;color:var(--ink-soft);min-height:18px;display:flex;gap:8px;align-items:center}
  .sdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
  .sdot.bad{background:var(--bad)} .sdot.ok{background:var(--ok)}
  .toolbar button{display:inline-flex;align-items:center;gap:6px}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:18px;max-width:460px;width:calc(100% - 36px);

/* =====================================================================
   ÚLOŽIŠTĚ — adaptér.
   V artefaktu na claude.ai používá window.storage; nasazené na Renderu
   spadne na localStorage; když nic není, zůstává jen export/import řetězec.
   Vše je obalené try/catch, takže selhání jen vypne automatické ukládání.
   ===================================================================== */
const Store=(()=>{
  try{
    if(typeof window!=="undefined" && window.storage && window.storage.get){
      return {
        get:k=>window.storage.get(k).then(r=>r?r.value:null).catch(()=>null),
        set:(k,v)=>window.storage.set(k,v).catch(()=>{}),
        list:p=>window.storage.list(p).then(r=>r&&r.keys?r.keys:[]).catch(()=>[]),
        del:k=>window.storage.delete(k).catch(()=>{}),
      };
    }
  }catch(e){}
  try{
    if(typeof window!=="undefined" && window.localStorage){
      const ls=window.localStorage;
      return {
        get:async k=>ls.getItem(k),
        set:async (k,v)=>{try{ls.setItem(k,v)}catch(e){}},
        list:async p=>Object.keys(ls).filter(x=>x.indexOf(p)===0),
        del:async k=>ls.removeItem(k),
      };
    }
  }catch(e){}
  return null;
})();

function card(id){ return LVL.cards.find(c=>c.id===id); }
// Oběd = kartička s kind:"break" — nařízená pauza, ne vyučovaná hodina.
// Nemá skutečného učitele ani učebnu, takže se u ní NEHLÍDÁ konflikt učitele
// a učebny (celá škola smí obědvat naráz); konflikt třídy platí normálně.
// Umístit ji lze jen do obědového okna — tvrdé pravidlo ve `fits`.
function isBreak(c){ return !!c && c.kind==="break"; }
function breakWindow(){ return LVL.breakWindow || [4,5]; }
function teaching(){ return LVL.cards.filter(c=>!isBreak(c)); }
// Abecední řazení entit (záložky, roletka, skupiny palety) — česká abeceda, čísla po řadě (T3 < T12).
const COLL=new Intl.Collator("cs",{numeric:true});
function classesOf(){ return [...new Set(LVL.cards.map(c=>c.class))].sort(COLL.compare); }
function teachersOf(){ return [...new Set(teaching().map(c=>c.teacher))].sort(COLL.compare); }
function roomsOf(){ return [...new Set(teaching().map(c=>c.room))].sort(COLL.compare); }
function entitiesOf(view){ return view==="teacher"?teachersOf():view==="room"?roomsOf():classesOf(); }
function entityOf(c,view){ return view==="teacher"?c.teacher:view==="room"?c.room:c.class; }
// Obory: IT = Informatika a management, EP = elektronické počítače,
// ELE = slaboproudá elektrotechnika, STR = strojírenství.
// legenda: zkratka jako na čipu třídy + plný název oboru (holé „Informatika“/„Počítače“ bylo nejasné, Jakub 21. 8. 2026)
const FIELD_NAMES={IT:"IT — informatika a management",EP:"EP — elektronické počítače",ELE:"S — slaboproudá elektrotechnika",STR:"ST — strojírenství"};
function fieldVar(f){ return f==="ELE"?"var(--ele)":f==="STR"?"var(--str)":f==="IT"?"var(--it)":f==="EP"?"var(--ep)":"var(--gen)"; }

/* =====================================================================
   LOGIKA — buňky, konflikty, cíle
   ===================================================================== */
function cells(id, pl){ // seznam {w,d,p} obsazených buněk
  const c=card(id), out=[];
  for(let k=0;k<c.duration;k++) out.push({w:pl.w,d:pl.d,p:pl.p+k});
  return out;
}
function fits(c, p){
  if(p<1 || p+c.duration-1>LVL.periods) return false;
  if(isBreak(c)){ const [a,b]=breakWindow(); return p>=a && p+c.duration-1<=b; } // nařízená pauza jen v obědovém okně
  return true;
}

function computeConflicts(){
  const occ={}, reasons={};
  const add=(id,m)=>{(reasons[id]=reasons[id]||new Set()).add(m);};
  for(const id in S.placements){
    const c=card(id);
    for(const cell of cells(id,S.placements[id])){
      const key=cell.w+"|"+cell.d+"|"+cell.p;
      (occ[key]=occ[key]||[]).push({id,t:c.teacher,r:c.room,cl:c.class,brk:isBreak(c)});
    }
  }
  for(const key in occ){
    const l=occ[key]; if(l.length<2) continue;
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){
      const a=l[i],b=l[j], pair=!a.brk&&!b.brk; // pauza nemá učitele ani učebnu → jen konflikt třídy
      if(pair&&a.t===b.t){add(a.id,a.t+" učí zároveň "+b.cl);add(b.id,b.t+" učí zároveň "+a.cl);}
      if(pair&&a.r===b.r){add(a.id,"učebna "+a.r+" je obsazená ("+b.cl+")");add(b.id,"učebna "+b.r+" je obsazená ("+a.cl+")");}
      if(a.cl===b.cl){add(a.id,a.cl+" má dvě hodiny naráz");add(b.id,b.cl+" má dvě hodiny naráz");}
    }
  }
  return reasons;
}
function hasHardConflict(id, pl, placements){ // pro řešič: konflikt mezi `id`@pl a už umístěnými
  const c=card(id);
  for(const cell of cells(id,pl)){
    for(const oid in placements){
      if(oid===id) continue;
      const oc=card(oid);
      for(const ocell of cells(oid,placements[oid])){
        if(ocell.w===cell.w && ocell.d===cell.d && ocell.p===cell.p){
          const pair=!isBreak(c)&&!isBreak(oc); // u pauzy se učitel ani učebna neposuzují
          if((pair&&(oc.teacher===c.teacher||oc.room===c.room))||oc.class===c.class) return true;
        }
      }
    }
  }
  return false;
}

function placedCardsFor(filter){ // {id,c,pl} splňující filter(c)
  const out=[];
  for(const id in S.placements){ const c=card(id); if(!filter||filter(c)) out.push({id,c,pl:S.placements[id]}); }
  return out;
}

function evalGoal(g){
  const allPlaced=fn=>LVL.cards.filter(fn).every(c=>S.placements[c.id]);
  const P=g.p||{};
  switch(g.type){
    case "all_placed":
      return LVL.cards.every(c=>S.placements[c.id]);
    case "subject_time":{
      const fn=c=>c.subject===P.subject && (!P.cls||c.class===P.cls);
      if(!allPlaced(fn)) return false;
      return LVL.cards.filter(fn).every(c=>{
        const pl=S.placements[c.id]; const end=pl.p+c.duration-1;
        return (P.maxPeriod?end<=P.maxPeriod:true) && (P.minPeriod?pl.p>=P.minPeriod:true) && (P.exact?pl.p===P.exact:true);
      });
    }
    case "subject_day":{
      const fn=c=>c.subject===P.subject && (!P.cls||c.class===P.cls);
      if(!allPlaced(fn)) return false;
      return LVL.cards.filter(fn).every(c=>S.placements[c.id].d===P.day);
    }
    case "teacher_free_day":{
      const fn=c=>c.teacher===P.teacher;
      if(!allPlaced(fn)) return false; // jinak by cíl svítil i s kartami v paletě
      const mine=placedCardsFor(fn);
      for(let d=0;d<DAYS.length;d++) if(!mine.some(x=>x.pl.d===d)) return true;
      return false;
    }
    case "teacher_only_week":{
      const fn=c=>c.teacher===P.teacher;
      if(!allPlaced(fn)) return false;
      return placedCardsFor(fn).every(x=>x.pl.w===P.week);
    }
    case "class_no_gaps":{
      const fn=c=>c.class===P.cls;
      if(!allPlaced(fn)) return false;
      for(let w=0;w<LVL.weeks.length;w++)for(let d=0;d<DAYS.length;d++){
        const ps=[];
        placedCardsFor(fn).filter(x=>x.pl.w===w&&x.pl.d===d).forEach(x=>{
          for(let k=0;k<x.c.duration;k++) ps.push(x.pl.p+k);
        });
        if(ps.length>1){ const u=[...new Set(ps)].sort((a,b)=>a-b); if(u[u.length-1]-u[0]+1!==u.length) return false; } // dedup: překryv (konflikt) nesmí maskovat okno
      }
      return true;
    }
    case "teacher_transition_gap":{
      // učitel aspoň jednou přejde mezi budovami a po KAŽDÉM přechodu má volnou hodinu.
      // Bez požadavku na existenci přechodu byl cíl zadarmo — stačilo rozházet
      // hodiny do různých dnů a „přebíhání“ se nekonalo.
      const fn=c=>c.teacher===P.teacher;
      if(!allPlaced(fn)) return false; // konzistentně s ostatními učitelskými cíli
      const mine=placedCardsFor(fn);
      let transitions=0;
      for(let w=0;w<LVL.weeks.length;w++)for(let d=0;d<DAYS.length;d++){
        const day=mine.filter(x=>x.pl.w===w&&x.pl.d===d).map(x=>({s:x.pl.p,e:x.pl.p+x.c.duration-1,b:x.c.building}));
        day.sort((a,b)=>a.s-b.s);
        for(let i=0;i<day.length-1;i++) if(day[i].b!==day[i+1].b){ if(day[i+1].s-day[i].e<2) return false; transitions++; }
      }
      return transitions>0;
    }
    case "teacher_time":{ // okno / zakázané hodiny či dny pro učitele
      const fn=c=>c.teacher===P.teacher;
      if(!allPlaced(fn)) return false;
      return placedCardsFor(fn).every(x=>{
        const s=x.pl.p, e=x.pl.p+x.c.duration-1;
        if(P.minPeriod && s<P.minPeriod) return false;
        if(P.maxPeriod && e>P.maxPeriod) return false;
        if(P.forbidDays && P.forbidDays.includes(x.pl.d)) return false;
        if(P.forbidPeriods){ for(let k=s;k<=e;k++) if(P.forbidPeriods.includes(k)) return false; }
        return true;
      });
    }
    case "subject_week":{ // předmět (volitelně dané třídy) se učí jen v daném týdnu
      const fn=c=>c.subject===P.subject && (!P.cls||c.class===P.cls);
      if(!allPlaced(fn)) return false;
      return LVL.cards.filter(fn).every(c=>S.placements[c.id].w===P.week);
    }
    case "max_per_day":{ // třída NEBO učitel nemá víc než P.max hodin v žádném dni (oběd se nepočítá — není to výuka)
      const fn = P.teacher ? (c=>c.teacher===P.teacher) : (c=>c.class===P.cls && !isBreak(c));
      if(!allPlaced(fn)) return false;
      for(let w=0;w<LVL.weeks.length;w++)for(let d=0;d<DAYS.length;d++){
        let h=0; placedCardsFor(fn).filter(x=>x.pl.w===w&&x.pl.d===d).forEach(x=>h+=x.c.duration);
        if(h>P.max) return false;
      }
      return true;
    }
    case "lunch_break":{ // třída má danou hodinu (period) volnou každý den — polední pauza
      const fn=c=>c.class===P.cls;
      if(!allPlaced(fn)) return false;
      return !placedCardsFor(fn).some(x=>{ for(let k=0;k<x.c.duration;k++) if(x.pl.p+k===P.period) return true; return false; });
    }
    default: return false;
  }
}

/* =====================================================================
   ŘEŠIČ — "Náhodně".  Bere aktuální (ručně) umístěné a zamčené jako pevné
   a zkouší doplnit zbytek tak, aby nevznikl žádný TVRDÝ konflikt.
   Randomizovaný backtracking se stropem; delší bloky se zkoušejí dřív
   (hůř se umisťují). Když nedoplní vše, vrátí nejlepší částečné a nahlásí,
   který tvrdý požadavek doplnění zablokoval. Volitelně (smart) zkouší víc
   pokusů a vybere ten s nejvíc splněnými měkkými cíli.
   ===================================================================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function startSlots(c){
  const out=[];
  for(let w=0;w<LVL.weeks.length;w++)for(let d=0;d<DAYS.length;d++)for(let p=1;p<=LVL.periods;p++)
    if(fits(c,p)) out.push({w,d,p});
  return out;
}
let FILL_TIMED_OUT=false; // poslední fillOnce narazil na časový limit (neřešitelný / přeplněný level)
function fillOnce(fixed,budget,ms){ // jeden pokus: vrací kompletní, nebo nejlepší částečné placements
  // strop uzlů NESTAČÍ: na přeplněném levelu z editoru stál jeden uzel tolik, že 200 000 uzlů
  // zamrazilo prohlížeč na minutu — proto i časový box (ms)
  const deadline=performance.now()+(ms||1500); FILL_TIMED_OUT=false;
  const todo=shuffle(LVL.cards.filter(c=>!fixed[c.id]).map(c=>c.id))
    .sort((a,b)=>card(b).duration-card(a).duration); // stabilní sort: delší bloky dřív, uvnitř náhodně
  let best={...fixed}, bestN=Object.keys(fixed).length;
  function bt(i,acc){
    if(budget--<=0) return null;
    if((budget&63)===0 && performance.now()>deadline){ budget=0; FILL_TIMED_OUT=true; return null; }
    if(Object.keys(acc).length>bestN){ bestN=Object.keys(acc).length; best={...acc}; }
    if(i>=todo.length) return {...acc};
    const c=card(todo[i]);
    for(const s of shuffle(startSlots(c))){
      if(!hasHardConflict(c.id,s,acc)){
        acc[c.id]=s;
        const r=bt(i+1,acc);
        if(r) return r;
        delete acc[c.id];
        if(budget<=0) break;
      }
    }
    return null;
  }
  return bt(0,{...fixed})||best;
}
function goalsMetIn(pl){ // kolik měkkých cílů splňuje dané rozmístění
  const saved=S.placements; S.placements=pl; let n=0;
  try{ LVL.goals.forEach(g=>{ if(evalGoal(g)) n++; }); }finally{ S.placements=saved; }
  return n;
}
function blockNote(pl){ // proč se zbylé kartičky nevešly (dominantní tvrdý blok)
  const missing=LVL.cards.filter(c=>!pl[c.id]);
  const parts=missing.slice(0,2).map(c=>{
    let t=0,r=0,cl=0;
    for(const s of startSlots(c)){
      let ct=false,cr=false,cc=false;
      for(const cell of cells(c.id,s)) for(const oid in pl){
        if(oid===c.id) continue;
        const oc=card(oid);
        for(const ocell of cells(oid,pl[oid]))
          if(ocell.w===cell.w&&ocell.d===cell.d&&ocell.p===cell.p){
            const pair=!isBreak(c)&&!isBreak(oc);
            if(pair&&oc.teacher===c.teacher)ct=true;
            if(pair&&oc.room===c.room)cr=true;
            if(oc.class===c.class)cc=true;
          }
      }
      if(ct)t++; if(cr)r++; if(cc)cl++;
    }
    const m=Math.max(t,r,cl);
    const why=m===0?"blok se nevejde":m===t?"učitel "+c.teacher+" nemá volno":m===r?"učebna "+c.room+" je plná":"třída "+c.class+" nemá místo";
    return c.subject+" "+c.class+" ("+why+")";
  });
  return "tvrdé požadavky zablokovaly: "+parts.join(", ")+(missing.length>2?" a další":"")+".";
}
function randomFill(smart){
  const fixed={...S.placements};
  let result=fillOnce(fixed,200000,1500), goalNote="";
  const timedOut=FILL_TIMED_OUT;
  if(smart){ // víc pokusů v časovém boxu, vyber podle (cíle, počet umístěných)
    let bestScore=goalsMetIn(result)*1000+Object.keys(result).length;
    const t0=performance.now();
    while(performance.now()-t0<700){
      const r=fillOnce(fixed,20000,150);
      const sc=goalsMetIn(r)*1000+Object.keys(r).length;
      if(sc>bestScore){ bestScore=sc; result=r; }
    }
    goalNote=" Splněno cílů: "+goalsMetIn(result)+"/"+LVL.goals.length+".";
  }
  if(JSON.stringify(result)!==JSON.stringify(S.placements)){ pushHist(); S.assisted=true; } // výhra poskládaná řešičem se nepočítá do ✓
  S.selected=null; S.pickedFrom=null;
  S.placements=result;
  const n=Object.keys(S.placements).length, tot=LVL.cards.length;
  render();
  setStatus(n===tot ? "Náhodně rozmístěno všech "+tot+" kartiček (bez tvrdých konfliktů)."+goalNote
                    : "Rozmístěno "+n+" z "+tot+" — "+blockNote(result)+(timedOut?" Řešič vyčerpal časový limit — level je možná neřešitelný.":""));
  autosave();
}

/* =====================================================================
   KONTROLA ŘEŠITELNOSTI — pomůcka pro ladění obtížnosti levelů.
   Vzorkuje náhodné KOMPLETNÍ rozvrhy (bez tvrdých konfliktů) a měří, jak
   často padne výhra (všechny cíle splněné). 0 výher = level je extrémně
   těžký nebo neřešitelný. Běží chunkovaně (časové boxy ~25 ms), aby
   nezamrzlo UI; globální LVL/S se prohazují jen UVNITŘ synchronního chunku
   (try/finally), mezi chunky je hra v konzistentním stavu.
   Z konzole: await checkSolvable("l2").
   ===================================================================== */
function checkSolvableAsync(levelId, samples, onProgress){
  // levelId: id NEBO přímo objekt levelu (editor testuje ještě neuložené levely)
  const lvl=typeof levelId==="object"&&levelId ? levelId : LEVELS.find(l=>l.id===(levelId||LVL.id));
  if(!lvl) return null;
  const M=samples||300;
  // zamčené kartičky jsou pevný základ každého vzorku: u rozehraného levelu
  // aktuální zamčené pozice, jinak given z dat levelu
  const fixedBase={};
  if(lvl===LVL) S.locked.forEach(id=>{ if(S.placements[id]) fixedBase[id]={...S.placements[id]}; });
  else if(lvl.given) for(const id in lvl.given) fixedBase[id]={...lvl.given[id]};
  const st={i:0, complete:0, wins:0, gm:lvl.goals.map(()=>0), cancelled:false};
  const base={}; let baseReady=false;
  function randomComplete(){ // volat jen uvnitř chunku (čte globální LVL)
    const order=shuffle(lvl.cards.filter(c=>!fixedBase[c.id]).map(c=>c.id)), plc={...fixedBase}; let budget=60000;
    function bt(i){
      if(budget--<=0) return false;
      if(i>=order.length) return true;
      const id=order[i];
      for(const s of shuffle(base[id].slice())) if(!hasHardConflict(id,s,plc)){ plc[id]=s; if(bt(i+1)) return true; delete plc[id]; }
      return false;
    }
    return bt(0)?plc:null;
  }
  function result(){
    return { level:lvl.id, samples:st.i, completeFound:st.complete, wins:st.wins,
      winRatePct:+(st.wins/Math.max(1,st.complete)*100).toFixed(1), solvable:st.wins>0,
      perGoal: lvl.goals.map((g,gi)=>({type:g.type, metPct:+(st.gm[gi]/Math.max(1,st.complete)*100).toFixed(0), label:g.label})) };
  }
  const promise=new Promise(resolve=>{
    function chunk(){
      if(st.cancelled||st.i>=M){ resolve(result()); return; }
      const savedLVL=LVL, savedPl=S.placements;
      LVL=lvl; // startSlots/fits/card/hasHardConflict/evalGoal čtou globální LVL a S
      try{
        if(!baseReady){ lvl.cards.forEach(c=>{ if(!fixedBase[c.id]) base[c.id]=startSlots(c); }); baseReady=true; }
        const t0=performance.now();
        while(st.i<M && performance.now()-t0<25){
          st.i++;
          const plc=randomComplete(); if(!plc) continue;
          st.complete++; S.placements=plc;
          let all=true; lvl.goals.forEach((g,gi)=>{ if(evalGoal(g)) st.gm[gi]++; else all=false; });
          if(all) st.wins++;
        }
      }finally{ LVL=savedLVL; S.placements=savedPl; } // obnov stav rozehrané hry
      if(onProgress) onProgress(st,M);
      setTimeout(chunk,0);
    }
    chunk();
  });
  return { promise, cancel:()=>{ st.cancelled=true; } };
}
function checkSolvable(levelId, samples){ // konzolová zkratka — vrací Promise
  const r=checkSolvableAsync(levelId,samples);
  return r?r.promise.then(res=>{ console.log("Řešitelnost levelu "+res.level+":",res); return res; }):null;
}

/* =====================================================================
   AKCE
   ===================================================================== */
function restoreLifted(){ // vrátí zvednutou (zatím neumístěnou) kartičku na původní místo
  if(S.selected && S.pickedFrom) S.placements[S.selected]=S.pickedFrom;
  S.pickedFrom=null;
}
function dropSelection(){ // přepnutí záložky/pohledu ruší výběr — kartička nesmí padat „naslepo“ do rozvrhu, který není vidět
  if(!S.selected) return;
  const back=!!S.pickedFrom;
  restoreLifted(); S.selected=null;
  setStatus(back?"Výběr zrušen — kartička je zpět na svém místě.":"Výběr zrušen.");
}
// Do kterého rozvrhu kartička patří v AKTUÁLNÍM pohledu (třída / učitel / učebna). Pauza nemá
// učitele ani učebnu, takže v pohledech Učitelé/Učebny nepatří nikam → přepne se na Třídy.
function homeOf(c){
  const e=entityOf(c,S.view);
  return entitiesOf(S.view).includes(e) ? {view:S.view,active:e} : {view:"class",active:c.class};
}
function focusHome(c){ const h=homeOf(c); S.view=h.view; S.active=h.active; }
function belongsHere(c){ return entityOf(c,S.view)===S.active; }
function pickUp(id){
  if(S.locked.has(id)){ setStatus("Tahle kartička je zamčená — je daná levelem."); return; }
  restoreLifted(); // výběr jiné kartičky vrací tu předchozí zvednutou zpět
  S.selected=id;
  focusHome(card(id)); // rozvrh, kam kartička patří — ve STEJNÉM pohledu (v Učitelích zůstáváme u učitele, Jakub 21. 8. 2026)
  if(S.placements[id]){ S.pickedFrom=S.placements[id]; delete S.placements[id]; } // zvednutí z rozvrhu
  setStatus("Kartička „"+card(id).subject+" "+card(id).class+"“ vybraná — klikni do rozvrhu „"+S.active+"“"+(S.pickedFrom?", nebo na zásobník (vrátí ji).":"."));
  render();
}
function unplace(id){ if(S.locked.has(id)) return; pushHist(); delete S.placements[id]; S.assisted=false; if(S.selected===id){S.selected=null;S.pickedFrom=null;} render(); autosave(); }
function tryPlace(id,w,d,p){
  if(S.locked.has(id)) return;
  const c=card(id);
  if(!c) return; // karta neexistuje (např. přepnutí levelu druhým prstem během tažení)
  if(!fits(c,p)){ setStatus(isBreak(c)
    ? "Oběd je nařízená pauza — smí být jen "+breakWindow()[0]+".–"+breakWindow()[1]+". hodinu."
    : "Sem se "+c.duration+"h blok nevejde — vyber dřívější hodinu."); return; }
  // vrácení kartičky na totéž místo není krok historie — a ani ruční zásah, který by shodil příznak
  // „poskládal řešič“ (jinak stačilo zvednout a pustit na místě a ✓ byl zadarmo)
  const same=S.selected===id && S.pickedFrom && S.pickedFrom.w===w && S.pickedFrom.d===d && S.pickedFrom.p===p;
  if(!same){ pushHist(); S.assisted=false; } // skutečný tah — deska je zase hráčova
  S.placements[id]={w,d,p};
  if(S.selected===id){ S.selected=null; S.pickedFrom=null; } // pickedFrom patří vybrané kartě — cizí nemazat
  setStatus("Umístěno. Konflikty jsou červené, splněné požadavky vpravo.");
  render(); autosave();
}
function clearAll(){
  if(Object.keys(S.placements).length||S.pickedFrom) pushHist();
  const keep={}; S.locked.forEach(id=>{ if(S.placements[id]) keep[id]=S.placements[id]; }); // zamčené zůstávají
  S.placements=keep; S.selected=null; S.pickedFrom=null; S.assisted=false; render(); autosave();
  setStatus(S.locked.size?"Rozvrh vymazán — zamčené kartičky zůstávají.":"Rozvrh vymazán.");
}

let statusEl;
function setStatus(t){ if(statusEl) statusEl.textContent=t; }
function setStatusDot(cls){ const d=document.getElementById("statusDot"); if(d) d.className="sdot"+(cls?" "+cls:""); }

/* =====================================================================
   HISTORIE — undo/redo přes snapshoty placements (per-level, jen session).
   Snapshot počítá zvednutou kartičku na jejím původním místě, takže přesun
   kartičky je jediný krok Zpět. pushHist() se volá PŘED mutací placements.
   ===================================================================== */
const HIST={undo:[],redo:[]};
function histSnapshot(){
  const o={...S.placements};
  if(S.selected&&S.pickedFrom) o[S.selected]=S.pickedFrom;
  return JSON.stringify(o);
}
function pushHist(){
  const s=histSnapshot();
  if(HIST.undo[HIST.undo.length-1]===s) return;
  HIST.undo.push(s); if(HIST.undo.length>50) HIST.undo.shift();
  HIST.redo.length=0;
}
function undo(){
  if(!HIST.undo.length) return;
  HIST.redo.push(histSnapshot());
  S.placements=JSON.parse(HIST.undo.pop());
  S.selected=null; S.pickedFrom=null; S.assisted=false; render(); autosave(); setStatus("Vráceno zpět.");
}
function redo(){
  if(!HIST.redo.length) return;
  HIST.undo.push(histSnapshot());
  S.placements=JSON.parse(HIST.redo.pop());
  S.selected=null; S.pickedFrom=null; S.assisted=false; render(); autosave(); setStatus("Provedeno znovu.");
}
function updateUndoBtns(){
  const u=document.getElementById("undoBtn"),r=document.getElementById("redoBtn");
  if(u){ u.disabled=!HIST.undo.length; r.disabled=!HIST.redo.length; }
}

/* =====================================================================
   POINTER DRAG — jednotné tažení myší i dotykem (pointer events).
   Klik zůstává plnohodnotnou cestou: tažení začíná až po prahu pohybu
   (myš 5 px) / podržení 200 ms (dotyk; švih = nativní scroll, browser pošle
   pointercancel a tím se vše samo odzbrojí). Během tažení se normálně
   renderuje (drop zóny svítí) — klon kartičky visí na <body> mimo
   překreslované kontejnery, listenery na dokumentu a pointer capture drží
   document.body, aby přežil odstranění zdrojového elementu z DOM.
   ===================================================================== */
const DRAG={ptr:null,id:null,from:null,el:null,ghost:null,ox:0,oy:0,sx:0,sy:0,lx:0,ly:0,
  armed:false,dragging:false,touch:false,timer:0,overCell:null,overPal:false,justDropped:false};

function armDrag(ev,id,fromPl){
  if(DRAG.armed||DRAG.dragging||!ev.isPrimary||ev.button!==0) return;
  if(S.locked.has(id)) return; // zamčená kartička se netáhne
  if(ev.target.closest(".x")) return; // křížek = odebrat, ne táhnout
  DRAG.armed=true; DRAG.ptr=ev.pointerId; DRAG.id=id; DRAG.from=fromPl||null;
  DRAG.el=ev.currentTarget; DRAG.touch=ev.pointerType!=="mouse";
  DRAG.sx=DRAG.lx=ev.clientX; DRAG.sy=DRAG.ly=ev.clientY;
  const r=DRAG.el.getBoundingClientRect(); DRAG.ox=ev.clientX-r.left; DRAG.oy=ev.clientY-r.top;
  if(DRAG.touch) DRAG.timer=setTimeout(()=>{ if(DRAG.armed&&!DRAG.dragging) startDrag(); },200);
  document.addEventListener("pointermove",dragMove);
  document.addEventListener("pointerup",dragUp);
  document.addEventListener("pointercancel",dragCancel);
}
function startDrag(){
  clearTimeout(DRAG.timer);
  if(!DRAG.el||!DRAG.el.isConnected){ disarmDrag(); return; } // zdroj mezitím zmizel z DOM (undo/resize v armed stavu)
  DRAG.dragging=true;
  try{document.body.setPointerCapture(DRAG.ptr)}catch(e){} // implicitní touch capture by zmizel s re-renderem zdroje
  const c=card(DRAG.id);
  if(S.selected!==DRAG.id) restoreLifted(); // jiná zvednutá karta se vrací — její pickedFrom se nesmí „přilepit“ k tažené
  S.selected=DRAG.id; focusHome(c);
  if(DRAG.from){ S.pickedFrom=DRAG.from; delete S.placements[DRAG.id]; }
  const src=DRAG.el, r=src.getBoundingClientRect(), g=src.cloneNode(true);
  const x=g.querySelector(".x"); if(x) x.remove();
  g.className+=" drag-ghost";
  g.style.gridArea="auto"; g.style.width=r.width+"px"; g.style.height=r.height+"px";
  document.body.append(g); DRAG.ghost=g;
  document.documentElement.classList.add("dragging");
  document.addEventListener("touchmove",blockTouchScroll,{passive:false}); // jediný spolehlivý zákaz scrollu od teď
  document.addEventListener("contextmenu",blockEvt);
  document.addEventListener("click",blockGhostClick,true);
  if(navigator.vibrate) navigator.vibrate(10);
  render();
  positionGhost(); hitTest(DRAG.lx,DRAG.ly);
  requestAnimationFrame(autoScrollLoop);
  setStatus("Táhni kartičku na místo v rozvrhu a pusť.");
}
function positionGhost(){ if(DRAG.ghost) DRAG.ghost.style.transform="translate("+(DRAG.lx-DRAG.ox)+"px,"+(DRAG.ly-DRAG.oy)+"px)"; }
function hitTest(x,y){
  // elementsFromPoint (celý stack): buňka může být zakrytá už položenou kartičkou
  // a drop na ni má vytvořit překryv (konflikt se zvýrazní, nezakazuje se)
  let cell=null, pal=false;
  for(const t of document.elementsFromPoint(x,y)){
    const c=t.closest?t.closest(".cell.drop"):null;
    if(c){ cell=c; break; }
    if(t.closest&&t.closest("#colPalette")){ pal=true; break; }
    if(t===document.body) break;
  }
  if(DRAG.overCell&&DRAG.overCell!==cell) DRAG.overCell.classList.remove("over");
  if(cell) cell.classList.add("over");
  DRAG.overCell=cell;
  DRAG.overPal=pal&&!!DRAG.from; // zásobník je cíl jen pro kartičku zvednutou z rozvrhu (= odebrání)
  document.getElementById("colPalette").classList.toggle("over",DRAG.overPal);
}
function autoScrollLoop(){ // tažení k okraji viewportu / boxu rozvrhu posouvá obsah
  if(!DRAG.dragging) return;
  const M=48,x=DRAG.lx,y=DRAG.ly; let moved=false;
  if(y<M){ window.scrollBy(0,-Math.ceil((M-y)/6)); moved=true; }
  else if(y>innerHeight-M){ window.scrollBy(0,Math.ceil((y-innerHeight+M)/6)); moved=true; }
  const sc=document.getElementById("schedule"), r=sc.getBoundingClientRect();
  if(x>r.left&&x<r.left+M){ sc.scrollLeft-=Math.ceil((r.left+M-x)/6); moved=true; }
  else if(x<r.right&&x>r.right-M){ sc.scrollLeft+=Math.ceil((x-r.right+M)/6); moved=true; }
  const pb=document.querySelector("#colPalette .col-body"), pr=pb.getBoundingClientRect(); // přilepený zásobník scrolluje uvnitř
  if(x>pr.left&&x<pr.right&&pb.scrollHeight>pb.clientHeight){
    if(y>pr.top&&y<pr.top+M){ pb.scrollTop-=Math.ceil((pr.top+M-y)/6); moved=true; }
    else if(y<pr.bottom&&y>pr.bottom-M){ pb.scrollTop+=Math.ceil((y-pr.bottom+M)/6); moved=true; }
  }
  if(moved) hitTest(x,y); // obsah pod nehybným prstem se posunul
  requestAnimationFrame(autoScrollLoop);
}
function dragMove(ev){
  if(ev.pointerId!==DRAG.ptr) return;
  if(!DRAG.touch && ev.buttons===0){ DRAG.dragging?cancelDrag():disarmDrag(); return; } // pointerup ztracený mimo okno
  DRAG.lx=ev.clientX; DRAG.ly=ev.clientY;
  if(DRAG.dragging){ positionGhost(); hitTest(DRAG.lx,DRAG.ly); return; }
  const dist=Math.hypot(DRAG.lx-DRAG.sx,DRAG.ly-DRAG.sy);
  if(!DRAG.touch){ if(dist>5) startDrag(); }
  else if(dist>10) disarmDrag(); // pohyb před vypršením holdu = uživatel scrolluje
}
function dragUp(ev){
  if(ev.pointerId!==DRAG.ptr) return;
  if(!DRAG.dragging){ disarmDrag(); return; } // krátký klik/tap — nech proběhnout click
  hitTest(ev.clientX,ev.clientY);
  const id=DRAG.id, cell=DRAG.overCell, toPal=DRAG.overPal;
  dragCleanup();
  if(cell) tryPlace(id,+cell.dataset.w,+cell.dataset.d,+cell.dataset.p);
  else if(toPal) returnToPalette();
  else dropNowhere();
}
function dragCancel(ev){ if(ev.pointerId!==DRAG.ptr) return; cancelDrag(); }
function cancelDrag(){ // pointercancel, Esc, blur okna
  if(!DRAG.dragging){ disarmDrag(); return; }
  dragCleanup(); dropNowhere();
}
function dropNowhere(){
  const back=!!S.pickedFrom;
  restoreLifted(); S.selected=null; render();
  setStatus(back?"Přesun zrušen — kartička je zpět na svém místě.":"Tažení zrušeno.");
}
function dragCleanup(){
  DRAG.dragging=false;
  try{document.body.releasePointerCapture(DRAG.ptr)}catch(e){}
  if(DRAG.ghost){ DRAG.ghost.remove(); DRAG.ghost=null; }
  if(DRAG.overCell){ DRAG.overCell.classList.remove("over"); DRAG.overCell=null; }
  DRAG.overPal=false; document.getElementById("colPalette").classList.remove("over");
  document.documentElement.classList.remove("dragging");
  document.removeEventListener("touchmove",blockTouchScroll);
  document.removeEventListener("contextmenu",blockEvt);
  DRAG.justDropped=true; // potlač „duchový“ click hned po dropu
  setTimeout(()=>{ DRAG.justDropped=false; document.removeEventListener("click",blockGhostClick,true); },0);
  disarmDrag();
}
function disarmDrag(){
  clearTimeout(DRAG.timer);
  document.removeEventListener("pointermove",dragMove);
  document.removeEventListener("pointerup",dragUp);
  document.removeEventListener("pointercancel",dragCancel);
  DRAG.armed=false; DRAG.ptr=null; DRAG.id=null; DRAG.from=null; DRAG.el=null;
}
function blockTouchScroll(e){ e.preventDefault(); }
function blockEvt(e){ e.preventDefault(); }
function blockGhostClick(e){ if(DRAG.justDropped||DRAG.dragging){ e.stopPropagation(); e.preventDefault(); } } // i tapy druhým prstem během tažení

/* =====================================================================
   RENDER
   ===================================================================== */
function el(tag,props,...kids){
  const e=document.createElement(tag); props=props||{};
  for(const k in props){
    const v=props[k];
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object") // custom property (--f) jde jen přes setProperty — Object.assign ji tiše zahodí
      for(const sk in v){ if(sk.indexOf("--")===0) e.style.setProperty(sk,v[sk]); else e.style[sk]=v[sk]; }
    else if(k.slice(0,2)==="on"&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!=null&&v!==false)e.setAttribute(k,v);
  }
  kids.flat().forEach(kid=>{ if(kid==null||kid===false)return; e.append(kid.nodeType?kid:document.createTextNode(kid)); });
  return e;
}

function render(){
  const ents=entitiesOf(S.view);
  if(!ents.includes(S.active)) S.active=ents[0];
  const conflicts=computeConflicts(); // jednou pro rozvrh i panel požadavků
  renderPalette(); renderTabs(); renderSchedule(conflicts); renderGoals(conflicts);
  updateUndoBtns(); updateDock();
}
// fixní lišta = „dok“; obsah dostane rezervu podle její skutečné výšky
// (požadavky do rezervy nepatří — na mobilu stojí v toku nahoře, ne nad lištou)
function updateDock(){
  const tb=document.getElementById("toolbar");
  if(!tb) return;
  const tbh=tb.offsetHeight;
  document.documentElement.style.setProperty("--tb-h",tbh+"px");
  document.documentElement.style.setProperty("--dock-h",tbh+"px");
}

function plural(n,one,few,many){ return n+" "+(n===1?one:n<5?few:many); }
function cardEl(c){
    return el("div",{
      class:"card dur"+c.duration+(isBreak(c)?" brk":"")+(S.selected===c.id?" sel":"")
        +(DRAG.dragging&&S.selected===c.id?" drag-src":""),
      style:{"--f":fieldVar(c.field),"--dur":c.duration},
      onclick:()=>pickUp(c.id),
      onpointerdown:ev=>armDrag(ev,c.id,null)
    },
      Array.from({length:c.duration-1},(_,k)=>el("div",{class:"tick",style:{left:((k+1)/c.duration*100)+"%"}})),
      isBreak(c)
        ? el("div",{class:"info"}, // pauza: místo učebny okno, místo učitele „nařízená pauza“
            el("div",{class:"subj"},c.subject),                   el("div",{class:"sub r"},breakWindow()[0]+".–"+breakWindow()[1]+". h"),
            el("div",{class:"sub"},el("span",{class:"chip"},c.class)), el("div",{class:"sub r"},"nařízená pauza")) // do 1h šířky: bez „Jídelna“ (říká totéž co „Oběd“), krátké okno
        : el("div",{class:"info"}, // stejná mřížka jako kartička v rozvrhu; třída navíc jako čip u učitele
            el("div",{class:"subj"},c.subject),                                 el("div",{class:"sub r"},c.room),
            el("div",{class:"sub"},el("span",{class:"chip"},c.class),c.teacher), el("div",{class:"sub r"},c.building)
          )
    );
}
function renderPalette(){
  const box=document.getElementById("palette"); box.textContent="";
  const unplaced=LVL.cards.filter(c=>!S.placements[c.id]);
  const cnt=document.getElementById("palCount"); if(cnt) cnt.textContent=unplaced.length?plural(unplaced.length,"zbývá","zbývají","zbývá"):"";
  // legenda oborů patří k paletě — vysvětluje barvy kartiček
  const lg=document.getElementById("legend"); if(lg){ lg.textContent="";
    [...new Set(teaching().map(c=>c.field))].forEach(f=>lg.append(el("span",{},el("span",{class:"sw",style:{background:fieldVar(f)}}),FIELD_NAMES[f]||f))); }
  if(!unplaced.length){ box.append(el("div",{class:"palette-empty"},"Všechny kartičky jsou v rozvrhu.")); return; }
  // skupiny po třídách: aktivní třída první a plná, ostatní tlumené (v l7 je 16 tříd — jinak se nedá zorientovat);
  // skupiny podle entity AKTUÁLNÍHO pohledu (třída / učitel / učebna): skupina zobrazeného rozvrhu první
  // a plná, ostatní tlumené — klik na tlumenou kartičku přepne rozvrh na její skupinu ve stejném pohledu.
  // Ve sloupcích pod sebou (≤ 1100 px: paleta stojí NAD rozvrhem) jen aktivní skupina, zbytek počtem.
  const narrow=window.matchMedia("(max-width:1100px)").matches;
  const key=c=>homeOf(c).view===S.view ? entityOf(c,S.view) : null; // null = pauza mimo pohled Třídy
  const order=entitiesOf(S.view).filter(e=>unplaced.some(c=>key(c)===e));
  if(order.includes(S.active)){ order.splice(order.indexOf(S.active),1); order.unshift(S.active); }
  const breaksOut=unplaced.filter(c=>key(c)===null);
  const what=S.view==="teacher"?"učitelé":S.view==="room"?"učebny":"třídy";
  let hidden=0;
  order.forEach(e=>{
    const cards=unplaced.filter(c=>key(c)===e);
    const dim=e!==S.active;
    if(narrow&&dim){ hidden+=cards.length; return; }
    const head=[el("b",{},e),el("span",{class:"muted"},plural(cards.length,"kartička","kartičky","kartiček")),el("span",{class:"ln"})];
    if(S.view==="class") head.unshift(el("span",{class:"sw",style:{background:fieldVar((cards.find(c=>!isBreak(c))||cards[0]).field)}}));
    box.append(el("div",{class:"pgroup"+(dim?" dim":""),title:dim?"Klikni na kartičku — přepne rozvrh na „"+e+"“":null},
      el("div",{class:"pg-head"},head),
      el("div",{class:"pg-cards"},cards.map(cardEl))
    ));
  });
  if(breaksOut.length&&!narrow) box.append(el("div",{class:"pgroup dim",title:"Oběd se pokládá v pohledu Třídy — klik tam přepne"},
    el("div",{class:"pg-head"},el("b",{},"Oběd"),el("span",{class:"muted"},"jen v pohledu Třídy"),el("span",{class:"ln"})),
    el("div",{class:"pg-cards"},breaksOut.map(cardEl))));
  else hidden+=breaksOut.length;
  if(hidden) box.append(el("div",{class:"palette-note"},"Ostatní "+what+": "+plural(hidden,"kartička","kartičky","kartiček")+" — přepni záložku."));
}
// kartička zvednutá z rozvrhu se vrací do zásobníku ťuknutím na něj nebo tažením na něj (na mobilu není ×)
function returnToPalette(){
  if(!(S.selected&&S.pickedFrom)) return;
  const c=card(S.selected);
  pushHist(); S.pickedFrom=null; S.selected=null; S.assisted=false; render(); autosave();
  setStatus("Kartička „"+c.subject+" "+c.class+"“ je zpět v zásobníku.");
}

function renderTabs(){
  const box=document.getElementById("tabs"); box.textContent="";
  // přepínač dimenze pohledu: třídy (hraní) / učitelé / učebny (jen čtení)
  const views=[["class","Třídy"],["teacher","Učitelé"],["room","Učebny"]];
  const seg=el("div",{class:"seg",role:"group","aria-label":"Pohled"});
  views.forEach(([v,lbl])=>{
    seg.append(el("button",{class:"tab view"+(v===S.view?" active":""),"aria-pressed":v===S.view?"true":"false",
      onclick:()=>{ const a=entitiesOf(v)[0];
        if(S.selected&&entityOf(card(S.selected),v)!==a) dropSelection();
        S.view=v; S.active=a; render(); }},lbl));
  });
  box.append(seg);
  box.append(el("div",{class:"tabsep"}));
  // záložky entit v aktuální dimenzi; na úzkém displeji rozbalovací pilulka (16 tříd v l7 se jinak nevejde)
  const pick=e=>{ if(S.selected&&entityOf(card(S.selected),S.view)!==e) dropSelection(); S.active=e; render(); };
  if(!isHorizontal()){
    const sel=el("select",{class:"tab tabsel active",onchange:ev=>pick(ev.target.value)});
    entitiesOf(S.view).forEach(e=>sel.append(el("option",{value:e},e)));
    sel.value=S.active; box.append(sel);
  }else entitiesOf(S.view).forEach(e=>{
    box.append(el("button",{class:"tab"+(e===S.active?" active":""),onclick:()=>pick(e)},e));
  });
}

// Desktop ("na šířku"): dny v řádcích, hodiny ve sloupcích.
// Úzký displej: transponováno (hodiny v řádcích, dolů). Při změně se překresluje.
function isHorizontal(){ return window.matchMedia("(min-width:820px)").matches; }

function renderSchedule(reasons){
  const box=document.getElementById("schedule"); box.textContent="";
  const horiz=isHorizontal();
  // hraje se ve všech třech pohledech: kartička jde položit jen do rozvrhu, který je vidět, a jen když
  // do něj patří (`belongsHere`) — jinak by padala „naslepo“ mimo obraz (oprava 9. 8. 2026)
  LVL.weeks.forEach((wname,w)=>{
    const wrap=el("div",{class:"week"});
    if(LVL.weeks.length>1) wrap.append(el("div",{class:"week-title"},wname+" týden"));

    // umístěné kartičky vybrané entity (třída / učitel / učebna) v tomto týdnu
    const placed=placedCardsFor(c=>entityOf(c,S.view)===S.active).filter(x=>x.pl.w===w);

    // PRUHY (lanes): překrývající se bloky v jednom dni dostanou různý pruh, aby se
    // nikdy neschovaly. Ve vodorovném rozvrhu se pruhy skládají svisle, ve svislém vodorovně.
    const lane={}, lanesInDay={};
    for(let d=0;d<DAYS.length;d++){
      const day=placed.filter(x=>x.pl.d===d)
        .map(x=>({id:x.id,s:x.pl.p,e:x.pl.p+x.c.duration-1}))
        .sort((a,b)=>a.s-b.s||a.e-b.e);
      const ends=[]; // konec posledního bloku v každém pruhu
      day.forEach(it=>{ let L=ends.findIndex(e=>e<it.s); if(L<0){L=ends.length;ends.push(0);} ends[L]=it.e; lane[it.id]=L; });
      lanesInDay[d]=Math.max(1,ends.length);
    }

    // MŘÍŽKA — osy podle orientace
    let grid;
    if(horiz){ // dny = řádky, hodiny = sloupce; řádek dne se zvětší podle počtu pruhů
      const rows=[]; for(let d=0;d<DAYS.length;d++) rows.push("minmax("+(46*lanesInDay[d])+"px,auto)");
      grid=el("div",{class:"grid",style:{
        gridTemplateColumns:"40px repeat("+LVL.periods+",minmax(54px,1fr))",
        gridTemplateRows:"26px "+rows.join(" ")
      }});
      grid.append(el("div",{class:"gp",style:{gridColumn:1,gridRow:1}},""));
      for(let p=1;p<=LVL.periods;p++) grid.append(el("div",{class:"gh",style:{gridColumn:p+1,gridRow:1}},p+"."));
      DAYS.forEach((dn,d)=>grid.append(el("div",{class:"gp",style:{gridColumn:1,gridRow:d+2}},dn)));
    }else{ // dny = sloupce, hodiny = řádky (transponováno pro úzký displej)
      grid=el("div",{class:"grid",style:{
        gridTemplateColumns:"26px repeat("+DAYS.length+",minmax(0,1fr))", // vejít se do šířky — stránka nesmí scrollovat do stran; názvy dělí hyphens:auto
        gridTemplateRows:"26px repeat("+LVL.periods+",minmax(46px,auto))"
      }});
      grid.append(el("div",{class:"gp",style:{gridColumn:1,gridRow:1}},""));
      DAYS.forEach((dn,d)=>grid.append(el("div",{class:"gh",style:{gridColumn:d+2,gridRow:1}},dn)));
      for(let p=1;p<=LVL.periods;p++) grid.append(el("div",{class:"gp",style:{gridColumn:1,gridRow:p+1}},p+"."));
    }

    // POZADÍ: všechny buňky. V herním pohledu jsou to drop zóny.
    for(let d=0;d<DAYS.length;d++)for(let p=1;p<=LVL.periods;p++){
      // pokládat jde jen do rozvrhu třídy, které kartička patří — jinak by padala „naslepo“ mimo obraz
      const droppable=S.selected && belongsHere(card(S.selected)) && fits(card(S.selected),p);
      const props={ class:"cell"+(droppable?" drop":""), "data-w":w,"data-d":d,"data-p":p,
        style:{gridColumn:horiz?p+1:d+2, gridRow:horiz?d+2:p+1} };
      props.onclick=()=>{ if(S.selected && belongsHere(card(S.selected))) tryPlace(S.selected,w,d,p); };
      grid.append(el("div",props));
    }

    // KARTIČKY — blok o `duration` hodinách se táhne podle orientace (doprava / dolů).
    // Na šířku se překryvy řeší pruhy (svisle v řádku dne); transponovaně je sloupec dne na pruhy
    // moc úzký (58 px na 390 px), takže překrývající se kartičky jdou POD SEBE do jednoho bloku
    // (`.lanegrp`, řádky hodin se natáhnou) — konflikt zůstává celý vidět a čitelný.
    const groups={}; // klíč „d|s“ → {s,e,cards[]} (souvislé překryvy v jednom dni; jen transponovaně)
    if(!horiz) for(let d=0;d<DAYS.length;d++){
      const day=placed.filter(x=>x.pl.d===d).map(x=>({x,s:x.pl.p,e:x.pl.p+x.c.duration-1})).sort((a,b)=>a.s-b.s||a.e-b.e);
      let cur=null;
      day.forEach(it=>{
        if(cur&&it.s<=cur.e){ cur.e=Math.max(cur.e,it.e); cur.cards.push(it.x); }
        else{ cur={d,s:it.s,e:it.e,cards:[it.x]}; groups[d+"|"+it.s]=cur; }
        cur.cards.forEach(x=>x._grp=cur);
      });
    }
    const grpEl={};
    placed.forEach(x=>{
      const c=x.c, conf=reasons[x.id], n=lanesInDay[x.pl.d], L=lane[x.id], span="span "+c.duration;
      const st={"--f":fieldVar(c.field)};
      const grp=!horiz&&x._grp&&x._grp.cards.length>1?x._grp:null; // transponovaný překryv → do bloku
      if(horiz){
        st.gridRow=x.pl.d+2; st.gridColumn=(x.pl.p+1)+" / "+span;
        if(n>1){ st.alignSelf="start"; st.height="calc((100% - "+((n-1)*4)+"px) / "+n+")"; }
        if(L>0){ st.transform="translateY(calc("+L+" * (100% + 4px)))"; }
      }else if(!grp){
        st.gridColumn=x.pl.d+2; st.gridRow=(x.pl.p+1)+" / "+span;
      }
      // sekundární popisek nezobrazuje to, podle čeho je pohled filtrovaný
      const sub = isBreak(c)          ? "nařízená pauza"
                : S.view==="teacher"  ? c.class+" · "+c.room
                : S.view==="room"     ? c.class+" · "+c.teacher
                : c.teacher+" · "+c.room;
      // desktop: dva sloupce (předmět | učebna, kdo | budova); v pohledu učeben je vpravo nahoře učitel
      const who = S.view==="class" ? c.teacher : c.class;
      const where = S.view==="room" ? c.teacher : c.room;
      const locked=S.locked.has(x.id);
      const props={
        class:"pcard"+(isBreak(c)?" brk":"")+(conf?" conflict":"")+(locked?" locked":""), style:st,
        title:conf?[...conf].join(" · "):isBreak(c)?c.subject+" · "+c.class+" — nařízená pauza"
                                                  :c.subject+" · "+c.teacher+" · "+c.room+" ("+c.building+")"
      };
      if(!locked){
        props.onclick=ev=>{ if(ev.target.classList.contains("x"))return; pickUp(x.id); };
        props.onpointerdown=ev=>armDrag(ev,x.id,x.pl);
      }else{
        props.title+=" — zamčená kartička (daná levelem)";
      }
      let host=grid;
      if(grp){ const k=grp.d+"|"+grp.s;
        if(!grpEl[k]){ grpEl[k]=el("div",{class:"lanegrp",style:{gridColumn:grp.d+2,gridRow:(grp.s+1)+" / span "+(grp.e-grp.s+1)}}); grid.append(grpEl[k]); }
        host=grpEl[k]; }
      host.append(el("div",props,
        // vícehodinový blok: čárka na každé hranici hodiny + štítek délky (kolmo na osu hodin dle orientace)
        Array.from({length:c.duration-1},(_,k)=>el("div",{class:"tick "+(horiz?"h":"v"),
          style:horiz?{left:((k+1)/c.duration*100)+"%"}:{top:((k+1)/c.duration*100)+"%"}})),
        c.duration>1?el("div",{class:"durb"},c.duration+"h"):null,
        !locked?el("div",{class:"x",title:"Odebrat",onclick:()=>unplace(x.id)},"×"):null,
        locked?el("div",{class:"lockb"},"🔒"):null,
        horiz&&!isBreak(c)
          ? el("div",{class:"info"},
              el("div",{class:"subj"},c.subject), el("div",{class:"sub r"},where),
              el("div",{class:"sub"},who),        el("div",{class:"sub r"},c.building))
          : [ el("div",{class:"subj"},c.subject),
              el("div",{class:"sub"},sub),
              isBreak(c)?null:el("div",{class:"sub"},c.building) ]
      ));
    });
    wrap.append(grid); box.append(wrap);
  });
}

function renderGoals(reasons){
  const box=document.getElementById("goals"); box.textContent="";
  const results=LVL.goals.map(g=>({g,met:evalGoal(g)}));
  const done=results.filter(r=>r.met).length, tot=results.length;
  const pct=tot?Math.round(done/tot*100):0;
  const confCount=Object.keys(reasons).length;

  const segbar=()=>el("div",{class:"segbar"},results.map(r=>el("i",{class:r.met?"met":""})));
  box.append(el("div",{class:"score"},el("b",{},String(done),el("span",{class:"of"}," / "+tot)),el("span",{class:"muted"},"požadavků splněno")));
  box.append(segbar());

  const why=confCount?conflictSummary(reasons):"";
  box.append(confCount
    ? el("div",{class:"conf-line bad"},"⚑",el("div",{},el("b",{},plural(confCount,"kartička v konfliktu","kartičky v konfliktu","kartiček v konfliktu")),el("div",{class:"why"},why)))
    : el("div",{class:"conf-line ok"},"Žádné konflikty."));
  setStatusDot(confCount?"bad":Object.keys(S.placements).length?"ok":"");
  // souhrn do hlavičky panelu (na mobilu je panel sbalený proužek nad lištou)
  const sum=document.getElementById("goalsSummary"); if(sum){ sum.textContent="";
    sum.append(el("b",{},done+" / "+tot),segbar(),
      confCount?el("span",{style:{color:"var(--bad)",fontWeight:650}},plural(confCount,"konflikt","konflikty","konfliktů")):el("span",{class:"muted"},"bez konfliktů")); }
  const badge=document.getElementById("placedBadge"); if(badge) badge.textContent=Object.keys(S.placements).length+" z "+LVL.cards.length+" umístěno";

  results.forEach(({g,met})=>{
    box.append(el("div",{class:"goal"+(met?" met":"")},
      el("div",{class:"dot"},met?"✓":""),
      el("div",{class:"txt"},g.label)
    ));
  });

  if(tot>0 && done===tot && confCount===0){
    // postup dál rovnou z banneru — jinak hráč bloumá a hledá přepínač levelů (Jakub, 21. 8. 2026)
    const next=LEVELS[LEVELS.indexOf(LVL)+1];
    const nextBtn=next
      ? el("button",{class:"next",onclick:()=>{ loadLevel(next.id); setStatus("Další level: "+next.name+"."); scrollTo(0,0); }},"Dál → "+next.name)
      : el("span",{class:"muted",style:{fontWeight:"500"}},"Tohle byl poslední level — kampaň je dohraná. Vlastní levely jde stavět v Editoru.");
    // fér ✓: výhru poskládanou řešičem/importem odznak nedostane
    const winBox=el("div",{class:"win"},S.assisted
      ? "Rozvrh sedí — ale poskládal ho řešič (nebo import). ✓ se počítá jen za vlastnoruční výhru. 😏"
      : "Hotovo — rozvrh sedí a všechny požadavky jsou splněné. 🎉", nextBtn);
    box.append(winBox);
    if(!S.assisted) markDone(LVL.id);
    if(!isHorizontal()){ // mobil: panel požadavků stojí nahoře, tak se k výhře (a tlačítku „Dál“) doscrolluje
      const g=document.getElementById("colGoals");
      if(!g.classList.contains("open")){ g.classList.add("open"); winBox.scrollIntoView({behavior:"smooth",block:"center"}); }
    }
  }
}
// kde a proč je konflikt: první obsazená buňka s víc kartičkami → „Út 2. h — 1.IT má dvě hodiny naráz (Matematika, Web)“
function conflictSummary(reasons){
  const occ={};
  for(const id in S.placements) if(reasons[id]) for(const cell of cells(id,S.placements[id])){
    const k=cell.w+"|"+cell.d+"|"+cell.p; (occ[k]=occ[k]||[]).push(id);
  }
  const keys=Object.keys(occ).filter(k=>occ[k].length>1).sort();
  if(!keys.length) return "";
  const [w,d,p]=keys[0].split("|").map(Number), ids=occ[keys[0]];
  const where=(LVL.weeks.length>1?LVL.weeks[w]+" · ":"")+DAYS[d]+" "+p+". h";
  return where+" — "+[...reasons[ids[0]]][0]+" ("+ids.map(id=>card(id).subject).join(", ")+")"+(keys.length>1?" + další":"");
}

function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
function exportStr(){ // zvednutá kartička se počítá na své původní pozici (jako v histSnapshot)
  const pl={...S.placements};
  if(S.selected&&S.pickedFrom) pl[S.selected]=S.pickedFrom;
  return b64e(JSON.stringify(S.assisted?{v:1,level:LVL.id,pl,a:1}:{v:1,level:LVL.id,pl}));
}
function validPlacement(id,pl){ // karta existuje a w/d/p jsou v mezích aktuálního levelu
  const c=card(id);
  return !!c && !!pl
    && Number.isInteger(pl.w) && pl.w>=0 && pl.w<LVL.weeks.length
    && Number.isInteger(pl.d) && pl.d>=0 && pl.d<DAYS.length
    && Number.isInteger(pl.p) && fits(c,pl.p);
}
function readPlacements(o){ // z cizích dat převezmi jen platné placementy a jen w/d/p
  const valid={};
  for(const id in (o.pl||{})){ const pl=o.pl[id]; if(validPlacement(id,pl)) valid[id]={w:pl.w,d:pl.d,p:pl.p}; }
  return valid;
}
let IMPORT_NOTE=""; // kolik kartiček poslední import vynechal — hráč má vědět, že pozice není celá
function importStr(str,opts){
  try{
    const o=JSON.parse(b64d(str.trim()));
    const lv=LEVELS.find(l=>l.id===o.level); if(!lv) throw 0;
    loadLevel(lv.id,false);
    const imported=readPlacements(o); // zamčené pozice drží applyGiven, import je nepřepisuje
    for(const id in imported){ if(!S.locked.has(id)) S.placements[id]=imported[id]; }
    const dropped=Object.keys(o.pl||{}).length-Object.keys(imported).length;
    IMPORT_NOTE=dropped<=0?"":" ("+(dropped===1?"1 neplatná kartička vynechána":dropped<5?dropped+" neplatné kartičky vynechány":dropped+" neplatných kartiček vynecháno")+")";
    S.assisted=true; // importovaná pozice — ✓ jen za vlastnoruční výhru
    render();
    if(!opts||opts.autosave!==false) autosave();
    setStatus("Pozice načtena."+IMPORT_NOTE);
    return true;
  }catch(e){ setStatus("Řetězec se nepodařilo načíst."); return false; }
}
function autosave(){ if(Store) Store.set("auto:"+LVL.id, exportStr()); }
async function loadAutosave(){
  if(!Store) return;
  const lvl=LVL; // hráč mohl během čekání na Store přepnout level
  const s=await Store.get("auto:"+LVL.id);
  if(LVL!==lvl) return;
  if(s){ try{
    const o=JSON.parse(b64d(s));
    const saved=readPlacements(o);
    for(const id in saved){ if(!S.locked.has(id)) S.placements[id]=saved[id]; }
    S.assisted=!!o.a; // příznak „poskládal řešič“ přežívá i reload
    render();
  }catch(e){} }
}
function copyText(t){ // clipboard API s fallbackem (file:// a starší prohlížeče)
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .catch(()=>{ const ta=el("textarea",{style:{position:"fixed",opacity:0}},t);
      document.body.append(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); });
}

function openOverlay(modal,onClose){ // společný obal modálů: klik mimo i Esc zavře, fokus skočí dovnitř a po zavření se vrátí.
  // Dřív zůstával fokus na tlačítku pod overlayem, takže Enter otevřel druhý modál přes první a Esc nedělal nic.
  // Fokus jde na první tlačítko (u potvrzení je to „Zrušit“ — Enter tedy nic nezničí), ne do inputu (mobil by vytáhl klávesnici).
  const prev=document.activeElement;
  const ov=el("div",{class:"overlay",onclick:ev=>{ if(ev.target===ov) close(); }},modal);
  function onKey(e){ if(e.key==="Escape"){ e.stopPropagation(); close(); } }
  function close(){
    if(!ov.isConnected) return;
    document.removeEventListener("keydown",onKey,true); ov.remove();
    if(onClose) onClose();
    if(prev&&prev.isConnected&&prev.focus) prev.focus();
  }
  document.addEventListener("keydown",onKey,true); // capture: předběhne globální Esc (výběr kartičky)
  document.body.append(ov);
  const f=modal.querySelector("[autofocus],button"); if(f) f.focus();
  ov.close=close; return ov;
}
