function goalDeadWithLocked(g){ // cíl, který zamčené kartičky znemožňují samy o sobě (doplněním dalších to nejde spravit)
  const P=g.p||{};
  const L=[]; S.locked.forEach(id=>{ const c=card(id), pl=S.placements[id]; if(c&&pl) L.push({c,pl}); });
  const sub=x=>x.c.subject===P.subject && (!P.cls||x.c.class===P.cls);
  switch(g.type){
    case "subject_time": return L.some(x=>sub(x) && ((P.maxPeriod&&x.pl.p+x.c.duration-1>P.maxPeriod)
      ||(P.minPeriod&&x.pl.p<P.minPeriod)||(P.exact&&x.pl.p!==P.exact)));
    case "subject_day":  return L.some(x=>sub(x)&&x.pl.d!==P.day);
    case "subject_week": return L.some(x=>sub(x)&&x.pl.w!==P.week);
    case "teacher_only_week": return L.some(x=>x.c.teacher===P.teacher&&x.pl.w!==P.week);
    case "teacher_time": return L.some(x=>{
      if(x.c.teacher!==P.teacher) return false;
      const s=x.pl.p, e=s+x.c.duration-1;
      if(P.minPeriod&&s<P.minPeriod) return true;
      if(P.maxPeriod&&e>P.maxPeriod) return true;
      if(P.forbidDays&&P.forbidDays.includes(x.pl.d)) return true;
      if(P.forbidPeriods){ for(let k=s;k<=e;k++) if(P.forbidPeriods.includes(k)) return true; }
      return false;
    });
    case "max_per_day":{
      const fn=P.teacher?(x=>x.c.teacher===P.teacher):(x=>x.c.class===P.cls&&!isBreak(x.c));
      for(let w=0;w<LVL.weeks.length;w++)for(let d=0;d<DAYS.length;d++){
        let h=0; L.filter(fn).filter(x=>x.pl.w===w&&x.pl.d===d).forEach(x=>h+=x.c.duration);
        if(h>P.max) return true;
      }
      return false;
    }
    case "lunch_break": return L.some(x=>{
      if(x.c.class!==P.cls) return false;
      for(let k=0;k<x.c.duration;k++) if(x.pl.p+k===P.period) return true;
      return false;
    });
    case "teacher_free_day":
      return new Set(L.filter(x=>x.c.teacher===P.teacher).map(x=>x.pl.d)).size>=DAYS.length;
    default: return false; // all_placed, class_no_gaps, transition_gap — z pevného základu rozhodnout nejde
  }
}
function carryReady(src,pl){ // iron-man přenáší jen DOHRANÝ zdroj: vše položené, bez tvrdého konfliktu, cíle splněné.
  // Rozehraný l4 s červeným konfliktem by se jinak zamkl do l5 jako neopravitelný konflikt
  // (zamčené nejde zvednout) a level by tiše nešel vyhrát; částečný l4 by zase l5 nechtěně zlehčil.
  const savedLVL=LVL, savedPl=S.placements;
  LVL=src; S.placements={};
  try{
    for(const id in pl){ if(validPlacement(id,pl[id])) S.placements[id]={w:pl[id].w,d:pl[id].d,p:pl[id].p}; }
    return src.cards.every(c=>S.placements[c.id]) && !Object.keys(computeConflicts()).length && src.goals.every(g=>evalGoal(g));
  }finally{ LVL=savedLVL; S.placements=savedPl; }
}
function applyGiven(){ // zamkne kartičky dané levelem: given z dat + iron-man přenos (carryFrom)
  const lvl=LVL; // hráč mohl během čekání na Store přepnout level
  S.locked=new Set();
  const lockAll=src=>{ for(const id in src){ if(validPlacement(id,src[id])){ S.placements[id]={w:src[id].w,d:src[id].d,p:src[id].p}; S.locked.add(id); } } };
  const unlockAll=()=>{ S.locked.forEach(id=>{ delete S.placements[id]; }); S.locked=new Set(); };
  lockAll(LVL.given||{});
  if(LVL.carryFrom && Store){
    return Store.get("auto:"+LVL.carryFrom).then(s=>{
      if(LVL!==lvl||!s) return; // level mezitím přepnut / bez rozehraného zdroje zůstává given
      try{
        const pl=JSON.parse(b64d(s)).pl||{};
        if(!Object.keys(pl).length) return;
        const src=LEVELS.find(l=>l.id===LVL.carryFrom);
        if(!src||!carryReady(src,pl)){ // rozehraný / konfliktní / nevyhraný zdroj zůstává u vzorového given
          setStatus("Rozvrh z minulého levelu není dohraný (nebo má konflikt) — zamčený základ je proto vzorové řešení. Chceš-li iron-man, nejdřív ho vyhraj.");
          return;
        }
        unlockAll(); lockAll(pl); // přenos nahrazuje výchozí given
        const dead=LVL.goals.find(goalDeadWithLocked);
        if(dead||Object.keys(computeConflicts()).length){ // přenesený rozvrh by level znemožnil → radši vzorový základ než neřešitelný level
          unlockAll(); lockAll(LVL.given||{});
          setStatus(dead?"S rozvrhem přeneseným z minulého levelu by nešlo splnit „"+dead.label+"“ — zamčený základ je proto vzorové řešení."
                        :"Rozvrh přenesený z minulého levelu má tady konflikt — zamčený základ je proto vzorové řešení.");
        }
        render();
      }catch(e){}
    });
  }
  return Promise.resolve();
}
function loadLevel(id,doAutoload){
  LVL=LEVELS.find(l=>l.id===id)||LEVELS[0];
  S.placements={}; S.selected=null; S.pickedFrom=null; S.assisted=false; S.view="class"; S.active=classesOf()[0];
  HIST.undo.length=0; HIST.redo.length=0; // historie je per-level
  document.getElementById("colGoals").classList.remove("open"); // mobil: proužek požadavků rozbalený výhrou se s novým levelem sbalí
  const ready=applyGiven(), cur=LVL;
  document.getElementById("lvlDesc").textContent=LVL.desc;
  document.getElementById("levelSel").value=LVL.id;
  document.getElementById("levelSel").title=LVL.desc; // na úzkém displeji je popis skrytý
  render();
  setStatus("Vyber kartičku a klikni do rozvrhu (nebo ji přetáhni).");
  if(doAutoload!==false) ready.then(()=>{ if(LVL===cur) loadAutosave(); });
}

function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  if(Store) Store.set("theme",t);
}

const DONE=new Set(); // id dokončených levelů (✓ v selectu)
function buildLevelSel(){ // přestaví přepínač levelů (✓ dokončené, * vlastní)
  const sel=document.getElementById("levelSel"); const cur=LVL?LVL.id:null;
  sel.textContent="";
  LEVELS.forEach(l=>sel.append(el("option",{value:l.id},l.name+(DONE.has(l.id)?" ✓":"")+(l.custom?" *":""))));
  if(cur&&LEVELS.some(l=>l.id===cur)) sel.value=cur;
}
function markDone(id){
  if(DONE.has(id)) return;
  DONE.add(id);
  if(Store) Store.set("done", JSON.stringify([...DONE]));
  buildLevelSel();
}

/* =====================================================================
   EDITOR LEVELŮ — vlastní levely jako JSON (stejný tvar jako v poli
   LEVELS). Ukládají se přes Store (klíč "customLevels"), v přepínači
   mají hvězdičku. Validace + test řešitelnosti před uložením.
   ===================================================================== */
const GOAL_TYPES={ // typ cíle → povinné parametry v p
  all_placed:[], subject_time:["subject"], subject_day:["subject","day"], subject_week:["subject","week"],
  teacher_free_day:["teacher"], teacher_only_week:["teacher","week"], teacher_transition_gap:["teacher"],
  teacher_time:["teacher"], class_no_gaps:["cls"], max_per_day:["max"], lunch_break:["cls","period"] };
function validateLevel(o){
  const errs=[];
  if(!o||typeof o!=="object") return ["Není to objekt."];
  if(!o.id||!/^[\w-]+$/.test(o.id)) errs.push("Chybí/špatné id (jen písmena, čísla, - a _).");
  if(LEVELS.some(l=>l.id===o.id&&!l.custom)) errs.push("id „"+o.id+"“ koliduje s vestavěným levelem.");
  if(!o.name) errs.push("Chybí name.");
  if(!Array.isArray(o.weeks)||o.weeks.length<1||o.weeks.length>2) errs.push("weeks musí být pole 1–2 názvů týdnů.");
  if(!Number.isInteger(o.periods)||o.periods<1||o.periods>12) errs.push("periods musí být celé číslo 1–12.");
  if(!Array.isArray(o.cards)||!o.cards.length) errs.push("cards musí být neprázdné pole.");
  else{
    const ids=new Set();
    o.cards.forEach((c,i)=>{
      ["id","class","subject","teacher","room","building"].forEach(k=>{ if(!c||!c[k]) errs.push("cards["+i+"]: chybí "+k+"."); });
      if(c&&c.id){ if(ids.has(c.id)) errs.push("cards["+i+"]: duplicitní id „"+c.id+"“."); ids.add(c.id); }
      if(c&&!["IT","EP","ELE","STR","BRK"].includes(c.field)) errs.push("cards["+i+"]: field musí být IT | EP | ELE | STR | BRK (pauza).");
      if(c&&c.kind&&c.kind!=="break") errs.push("cards["+i+"]: kind smí být jen \"break\".");
      if(c&&c.field==="BRK"&&!isBreak(c)) errs.push("cards["+i+"]: field BRK patří jen kartičce s kind:\"break\".");
      if(c&&(!Number.isInteger(c.duration)||c.duration<1||c.duration>3)) errs.push("cards["+i+"]: duration musí být 1–3.");
    });
    const rb={}; // učebna musí mít všude stejnou budovu
    o.cards.forEach((c,i)=>{ if(c&&c.room&&c.building){
      if(rb[c.room]&&rb[c.room]!==c.building) errs.push("cards["+i+"]: učebna "+c.room+" je jednou v "+rb[c.room]+", jinde v "+c.building+".");
      rb[c.room]=c.building;
    }});
    if(o.given&&Array.isArray(o.cards)) for(const id in o.given){
      const c=o.cards.find(x=>x&&x.id===id), pl=o.given[id];
      if(!c){ errs.push("given: neznámá karta „"+id+"“."); continue; }
      if(!pl||!Number.isInteger(pl.w)||pl.w<0||pl.w>=o.weeks.length
        ||!Number.isInteger(pl.d)||pl.d<0||pl.d>=DAYS.length
        ||!Number.isInteger(pl.p)||pl.p<1||pl.p+c.duration-1>o.periods) errs.push("given."+id+": neplatná pozice.");
    }
  }
  if(!Array.isArray(o.goals)||!o.goals.length) errs.push("goals musí být neprázdné pole (bez cílů je level okamžitá výhra).");
  else o.goals.forEach((g,i)=>{
    if(!g||!GOAL_TYPES[g.type]){ errs.push("goals["+i+"]: neznámý type „"+(g&&g.type)+"“. Povolené: "+Object.keys(GOAL_TYPES).join(", ")+"."); return; }
    if(!g.label) errs.push("goals["+i+"]: chybí label.");
    const P=g.p||{}; // chybějící parametry = cíl je tiše triviální nebo nesplnitelný — radši chyba
    GOAL_TYPES[g.type].forEach(k=>{ if(P[k]===undefined) errs.push("goals["+i+"] ("+g.type+"): chybí parametr p."+k+"."); });
    if(g.type==="max_per_day" && P.cls===undefined && P.teacher===undefined) errs.push("goals["+i+"]: max_per_day potřebuje p.cls nebo p.teacher.");
    if(g.type==="subject_time" && P.maxPeriod===undefined && P.minPeriod===undefined && P.exact===undefined) errs.push("goals["+i+"]: subject_time potřebuje maxPeriod, minPeriod nebo exact.");
    if(g.type==="teacher_time" && P.maxPeriod===undefined && P.minPeriod===undefined && !P.forbidPeriods && !P.forbidDays) errs.push("goals["+i+"]: teacher_time potřebuje aspoň jedno omezení.");
  });
  if(o.carryFrom&&(o.carryFrom===o.id||!LEVELS.some(l=>l.id===o.carryFrom))) errs.push("carryFrom: level „"+o.carryFrom+"“ neexistuje nebo odkazuje sám na sebe.");
  return errs;
}
function saveCustoms(){ if(Store) Store.set("customLevels", JSON.stringify(LEVELS.filter(l=>l.custom))); }
async function loadCustoms(){
  if(!Store) return;
  try{
    const s=await Store.get("customLevels");
    const added=[];
    JSON.parse(s||"[]").forEach(o=>{
      if(!o||typeof o!=="object"||LEVELS.some(l=>l.id===o.id)) return;
      o.custom=true; LEVELS.push(o); added.push(o);
    });
    // validace až po přidání všech (carryFrom může mířit na jiný custom level);
    // poškozený záznam by jinak při výběru shodil celou hru
    added.forEach(o=>{ if(validateLevel(o).length) LEVELS.splice(LEVELS.indexOf(o),1); });
  }catch(e){}
  buildLevelSel();
}
function handleHash(){ // #p=<pozice> / #l=<level>; vrací true, když hash zkonzumoval
  const h=location.hash.match(/^#(p|l)=(.+)/); if(!h) return false;
  let ok=false;
  try{
    const val=decodeURIComponent(h[2]);
    ok = h[1]==="p" ? importStr(val,{autosave:false}) : importLevelStr(val);
  }catch(e){}
  if(ok){
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} // reload už nepřepíše rozehranou pozici
    if(h[1]==="p") setStatus("Načtena sdílená pozice."+IMPORT_NOTE);
  }
  return ok;
}
function importLevelStr(str){ // sdílený level z odkazu (#l=…) → uložit mezi vlastní a načíst
  try{
    const o=JSON.parse(b64d(str.trim()));
    delete o.custom;
    if(validateLevel(o).length) throw 0;
    o.custom=true;
    const i=LEVELS.findIndex(l=>l.id===o.id&&l.custom);
    if(i>=0) LEVELS[i]=o; else{ if(LEVELS.some(l=>l.id===o.id)) throw 0; LEVELS.push(o); }
    saveCustoms(); buildLevelSel();
    loadLevel(o.id);
    setStatus("Načten sdílený level „"+o.name+"“ — najdeš ho i v přepínači (s hvězdičkou).");
    return true;
  }catch(e){ setStatus("Odkaz s levelem se nepodařilo načíst."); return false; }
}
function editorModal(){
  let edRun=null; // běžící test řešitelnosti (zrušit při novém spuštění / zavření)
  let ov; // obal vzniká až pod obsahem
  function closeEd(){ ov.close(); }
  const ta=el("textarea",{spellcheck:"false",style:{minHeight:"260px"}});
  const msg=el("div",{style:{fontSize:"12px",whiteSpace:"pre-wrap",margin:"6px 0",minHeight:"16px"}});
  const say=(t,bad)=>{ msg.textContent=t; msg.style.color=bad?"var(--bad)":"var(--ok)"; };
  const parse=()=>{ try{ return JSON.parse(ta.value); }catch(e){ say("Neplatný JSON: "+e.message,true); return null; } };
  const parseValid=()=>{ const o=parse(); if(!o) return null;
    const errs=validateLevel(o); if(errs.length){ say(errs.join("\n"),true); return null; } return o; };
  const tplSel=el("select",{});
  tplSel.append(el("option",{value:""},"Nový podle šablony…"));
  LEVELS.forEach(l=>tplSel.append(el("option",{value:l.id},l.name)));
  tplSel.addEventListener("change",()=>{
    const l=LEVELS.find(x=>x.id===tplSel.value); if(!l) return;
    const o=JSON.parse(JSON.stringify(l)); delete o.custom;
    o.id="c-"+Math.random().toString(36).slice(2,7); o.name=l.name+" (kopie)";
    ta.value=JSON.stringify(o,null,2); say("",false);
  });
  const custBox=el("div",{});
  function listCustoms(){
    custBox.textContent="";
    const cs=LEVELS.filter(l=>l.custom);
    if(!cs.length){ custBox.append(el("p",{style:{marginTop:"8px"}},"Zatím žádné vlastní levely.")); return; }
    cs.forEach(l=>custBox.append(el("div",{class:"slot-row"},
      el("span",{class:"name"},l.name+" ("+l.id+")"),
      el("button",{onclick:()=>{ const o=JSON.parse(JSON.stringify(l)); delete o.custom; ta.value=JSON.stringify(o,null,2); say("",false); }},"Upravit"),
      el("button",{onclick:()=>{ LEVELS.splice(LEVELS.indexOf(l),1); saveCustoms(); buildLevelSel(); listCustoms(); if(LVL===l) loadLevel(LEVELS[0].id); }},"Smazat")
    )));
  }
  ov=openOverlay(el("div",{class:"modal",style:{maxWidth:"640px"}},
    el("h3",{},"Editor levelů"),
    el("p",{},"Level je JSON stejného tvaru jako vestavěné levely (cards, goals, volitelně given/carryFrom). Typy cílů a parametry popisuje CLAUDE.md."),
    el("div",{class:"row",style:{justifyContent:"flex-start",marginBottom:"8px"}},tplSel),
    ta, msg,
    el("div",{class:"row",style:{justifyContent:"flex-start"}},
      el("button",{onclick:()=>{ if(parseValid()) say("Level je v pořádku.",false); }},"Zkontrolovat"),
      el("button",{onclick:()=>{
        const o=parseValid(); if(!o) return;
        if(edRun) edRun.cancel(); // nespouštět dva běhy vedle sebe
        say("Testuju řešitelnost…",false);
        edRun=checkSolvableAsync(o,200,st=>{ say("Testuju řešitelnost… vzorek "+st.i+"/200, výher "+st.wins+".",false); });
        edRun.promise.then(r=>{ if(!ov.isConnected) return;
          say(r.solvable?("Řešitelné — výhra ≈"+r.winRatePct+" % náhodných rozvrhů."):"Nenašla se výhra (200 vzorků) — level je hodně těžký nebo neřešitelný.",!r.solvable); });
      }},"Jde to vyhrát?"),
      location.protocol.indexOf("http")===0?el("button",{onclick:()=>{
        const o=parseValid(); if(!o) return;
        delete o.custom;
        copyText(location.origin+location.pathname+location.search+"#l="+encodeURIComponent(b64e(JSON.stringify(o))));
        say("Odkaz na level zkopírován — příjemci se uloží mezi vlastní levely.",false);
      }},"Odkaz na level"):null,
      el("button",{class:"primary",onclick:()=>{
        const o=parseValid(); if(!o) return;
        o.custom=true;
        const i=LEVELS.findIndex(l=>l.id===o.id&&l.custom);
        if(i>=0) LEVELS[i]=o; else LEVELS.push(o);
        saveCustoms(); buildLevelSel(); listCustoms();
        if(LVL.id===o.id) loadLevel(o.id); // právě hraný level → načíst novou verzi
        say("Uloženo — level „"+o.name+"“ je v přepínači.",false);
      }},"Uložit level")
    ),
    el("h3",{style:{marginTop:"16px",fontSize:"14px"}},"Vlastní levely"),
    custBox,
    el("div",{class:"row",style:{marginTop:"10px"}},el("button",{onclick:closeEd},"Zavřít"))
  ),()=>{ if(edRun) edRun.cancel(); }); // zavření ruší běžící test řešitelnosti
  listCustoms();
}

window.addEventListener("DOMContentLoaded",()=>{
  statusEl=document.getElementById("statusText");
  buildLevelSel();
  document.getElementById("levelSel").addEventListener("change",ev=>loadLevel(ev.target.value));

  document.getElementById("clearBtn").onclick=()=>confirmModal(
    "Smazat rozvrh?","Všechny kartičky se vrátí do seznamu (zamčené zůstávají). Vrátit to jde tlačítkem ↶ Zpět.",clearAll,"Smazat");
  document.getElementById("randomBtn").onclick=randomModal;
  document.getElementById("saveBtn").onclick=saveModal;
  document.getElementById("editBtn").onclick=editorModal;
  document.getElementById("aboutBtn").onclick=aboutModal;
  document.getElementById("checkBtn").onclick=solvableModal;
  document.getElementById("undoBtn").onclick=undo;
  document.getElementById("redoBtn").onclick=redo;
  // „Více“ (mobil): Editor a Uložit v rozbalovací nabídce
  const moreBtn=document.getElementById("moreBtn"), more=document.getElementById("moreMenu");
  const closeMore=()=>{ more.classList.remove("open"); moreBtn.setAttribute("aria-expanded","false"); };
  moreBtn.onclick=ev=>{ ev.stopPropagation(); const o=!more.classList.contains("open"); more.classList.toggle("open",o); moreBtn.setAttribute("aria-expanded",o?"true":"false"); };
  more.addEventListener("click",closeMore); document.addEventListener("click",ev=>{ if(!ev.target.closest("#moreMenu,#moreBtn")) closeMore(); });
  // požadavky na mobilu: sbalený proužek, ťuknutí rozbalí
  document.getElementById("goalsHead").onclick=()=>{ if(!isHorizontal()) document.getElementById("colGoals").classList.toggle("open"); };
  // ťuknutí na zásobník (mimo kartičku) vrací zvednutou kartičku z rozvrhu
  document.getElementById("colPalette").addEventListener("click",ev=>{ if(ev.target.closest(".card")) return; if(S.selected&&S.pickedFrom) returnToPalette(); });

  // motiv nastavil synchronní skript v <head>; async úložiště (artefakt) ho jen doladí
  if(Store) Store.get("theme").then(t=>{ if(t && t!==document.documentElement.getAttribute("data-theme")) setTheme(t); });
  document.getElementById("themeBtn").onclick=()=>
    setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

  if(Store) Store.get("done").then(s=>{ try{ JSON.parse(s||"[]").forEach(id=>DONE.add(id)); }catch(e){} buildLevelSel(); });

  document.addEventListener("keydown",e=>{
    if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
    if(e.key==="Escape"){
      if(DRAG.dragging){ cancelDrag(); return; }
      if(S.selected){ const back=!!S.pickedFrom; restoreLifted(); S.selected=null; render();
        setStatus(back?"Výběr zrušen — kartička je zpět na svém místě.":"Výběr zrušen."); }
    }
    else if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==="y" || (e.shiftKey&&e.key.toLowerCase()==="z"))){ e.preventDefault(); redo(); }
  });
  window.addEventListener("blur",()=>{ if(DRAG.dragging) cancelDrag(); });

  // překresli rozvrh při změně orientace (desktop na šířku ↔ úzký displej dolů).
  // Hlídá se přes resize (spolehlivější než matchMedia), překreslí jen při PŘEKLOPENÍ.
  let lastHoriz=isHorizontal(), lastStacked=window.matchMedia("(max-width:1100px)").matches;
  window.addEventListener("resize",()=>{ const h=isHorizontal(), st=window.matchMedia("(max-width:1100px)").matches;
    if(h!==lastHoriz||st!==lastStacked){ lastHoriz=h; lastStacked=st; document.getElementById("colGoals").classList.remove("open"); render(); } else updateDock(); });
  updateDock();

  // nejdřív vlastní levely (sdílený odkaz může mířit na custom level), pak hash:
  // #p=<pozice> nebo #l=<celý level>; jinak výchozí level
  loadCustoms().then(()=>{ if(!handleHash()) loadLevel(LEVELS[0].id); });
  // vložení odkazu do adresního řádku nad běžící hrou reload nevyvolá — chytit hashchange
  window.addEventListener("hashchange",handleHash);
});
